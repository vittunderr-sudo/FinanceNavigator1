name: Build FinanceNavigator APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK, NDK and CMake
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Unpack FinanceNavigator
        run: |
          mkdir -p project

          unzip -o "FinanceNavigator_LocalAI_Test_GitHubActions (1).zip" -d project

          echo "Original project contents:"
          find project -maxdepth 4 -type f | sort

      - name: Unpack updated app
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

          7z x -y appv2.rar -oproject

          echo "Updated project contents:"
          find project -maxdepth 6 -type f | sort

      - name: Fix app build.gradle
        run: |
          cat > project/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.financenavigator'
              compileSdk 35

              ndkVersion "27.0.12077973"

              defaultConfig {
                  applicationId 'com.example.financenavigator'
                  minSdk 26
                  targetSdk 35
                  versionCode 2
                  versionName '1.1.0'
              }

              externalNativeBuild {
                  cmake {
                      path file('src/main/cpp/CMakeLists.txt')
                  }
              }
          }

          dependencies {
              implementation 'androidx.core:core:1.15.0'
              implementation 'androidx.activity:activity:1.10.1'
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'com.google.mlkit:text-recognition:16.0.1'
          }
          EOF

          echo "Fixed app/build.gradle:"
          cat project/app/build.gradle

      - name: Find Android project
        run: |
          BUILD_FILE=$(find project -name "build.gradle" -type f | head -n 1)

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: build.gradle not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")

          while [ "$PROJECT_DIR" != "." ] && [ "$PROJECT_DIR" != "/" ]; do
            if [ -f "$PROJECT_DIR/settings.gradle" ] || [ -f "$PROJECT_DIR/settings.gradle.kts" ]; then
              break
            fi

            PROJECT_DIR=$(dirname "$PROJECT_DIR")
          done

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle not found"
            exit 1
          fi

          echo "Android project found in: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Gradle wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle wrapper --gradle-version 8.9

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FinanceNavigator-debug
          path: |
            **/build/outputs/apk/debug/*.apk
